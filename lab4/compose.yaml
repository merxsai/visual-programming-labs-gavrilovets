name: gavrilovets-lab4

services:
  n8n:
    image: n8nio/n8n:2.48.7
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Minsk
      TZ: Europe/Minsk
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
    volumes:
      - ./.runtime/n8n:/home/node/.n8n
      - ./.runtime/data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
